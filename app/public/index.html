<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Flow · 多 AI 定时汇总工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236c8cff'/%3E%3Cpath d='M8 21.5c3.8-8 9.5-11.5 16-10.5-2.2 7.5-8.2 11.7-16 10.5Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.7 12 4l8 6.7V20a1 1 0 0 1-1 1h-4.6v-5.6H9.6V21H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 5.5h1.5v1.5H4zM4 11.5h1.5V13H4zM4 17.5h1.5V19H4z"/></symbol>
    <symbol id="i-platforms" viewBox="0 0 24 24"><path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z"/><path d="m4 12 8 4.5 8-4.5"/><path d="m4 16.5 8 4.5 8-4.5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V9H8"/><path d="M12 7.8v4.7l3 1.8"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.2.65.77 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 14.5 18 8.5"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 1.8"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5M9 12h6M9 15.5h6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 6l6 6-6 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19.5h16"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7A1.5 1.5 0 0 1 5 5.5h4l2 2h8A1.5 1.5 0 0 1 20.5 9v9A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 5.5V11h-5.5"/><path d="M19.2 10.2A8 8 0 1 0 20 14"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="m14.5 6.5 3 3"/></symbol>
    <symbol id="i-login" viewBox="0 0 24 24"><path d="M13 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"/><path d="M10 8l4 4-4 4M3 12h11"/></symbol>
    <symbol id="i-browser" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 9h18M6.5 6.8h.01M9.5 6.8h.01"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5.5c0 4.6 3 7.4 7 9.5 4-2.1 7-4.9 7-9.5V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5c.5 4.5 2.5 6.5 7 7-4.5.5-6.5 2.5-7 7-.5-4.5-2.5-6.5-7-7 4.5-.5 6.5-2.5 7-7Z"/><path d="M19 16.5c.2 1.5.8 2.1 2.3 2.3-1.5.2-2.1.8-2.3 2.3-.2-1.5-.8-2.1-2.3-2.3 1.5-.2 2.1-.8 2.3-2.3Z"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l2.5-2.5a4 4 0 0 0-5.7-5.7L11 7.3"/><path d="M14 10a4 4 0 0 0-5.7 0l-2.5 2.5a4 4 0 0 0 5.7 5.7l1.5-1.5"/></symbol>
  </svg>

  <div class="window-drag" data-tauri-drag-region aria-hidden="true"></div>
  <div class="window-controls" aria-label="窗口">
    <button type="button" class="win-btn" data-window="minimize" aria-label="最小化" title="最小化">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5h8"/></svg>
    </button>
    <button type="button" class="win-btn" data-window="toggle-maximize" aria-label="最大化" title="最大化">
      <svg class="max-icon" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg>
      <svg class="restore-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.2 4.2V2.8h5v5H7.8"/><rect x="2.8" y="4.2" width="5" height="5" rx="1"/></svg>
    </button>
    <button type="button" class="win-btn close" data-window="close" aria-label="关闭" title="关闭">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.8 2.8 9.2 9.2M9.2 2.8 2.8 9.2"/></svg>
    </button>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M8 21.5c3.8-8 9.5-11.5 16-10.5-2.2 7.5-8.2 11.7-16 10.5Z" fill="#fff"/>
            <path d="M8.5 15.3c2.9-5.3 7-7.8 11.8-7.2-1.7 5.1-5.9 8-11.8 7.2Z" fill="#fff" opacity=".62"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">AI Flow</div>
          <div class="brand-sub">Your AI Agent Hub</div>
        </div>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item" data-view="home"><svg class="icon"><use href="#i-home"/></svg><span>首页</span></button>
        <button class="nav-item" data-view="tasks"><svg class="icon"><use href="#i-tasks"/></svg><span>任务</span></button>
        <button class="nav-item" data-view="platforms"><svg class="icon"><use href="#i-platforms"/></svg><span>AI 平台</span></button>
        <button class="nav-item" data-view="history"><svg class="icon"><use href="#i-history"/></svg><span>历史记录</span></button>
        <button class="nav-item" data-view="settings"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></button>
      </nav>

      <div class="sidebar-space"></div>

      <div class="promo">
        <div class="promo-glow"></div>
        <div class="promo-scene" aria-hidden="true">
          <span class="orb orb-a"></span>
          <span class="orb orb-b"></span>
          <span class="orb orb-c"></span>
          <span class="pane"></span>
        </div>
        <div class="promo-copy">
          <h3>让多个 AI<br>为你工作</h3>
          <p>自动获取 · 整合汇总</p>
        </div>
        <button class="promo-btn" data-action="start-now">开始使用 <span class="arrow">→</span></button>
      </div>
      <div class="sidebar-foot"><span class="local-dot"></span>本地运行 · 数据不出电脑</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow" id="eyebrow">欢迎回来</p>
          <h1 id="headline">让多个 AI 为你收集信息</h1>
          <p class="subline" id="subline">定时获取 · 自动汇总 · 一键复制</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="bell-btn" aria-label="最近完成" title="最近完成">
            <svg class="icon"><use href="#i-bell"/></svg>
            <span class="bell-dot" id="bell-dot" hidden></span>
          </button>
          <button class="avatar" id="avatar-btn" aria-label="打开设置" title="设置">我</button>
          <button class="primary" data-action="new-task">
            <svg class="icon icon-fill"><use href="#i-play"/></svg>新建任务
          </button>
        </div>
      </header>

      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
